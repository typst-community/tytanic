# Based on ripgrep's release action:
# https://github.com/BurntSushi/ripgrep/blob/master/.github/workflows/release.yml

name: Build release binaries
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-release-binaries:
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-musl
          os: ubuntu-latest
          cross: true
        - target: aarch64-unknown-linux-musl
          os: ubuntu-latest
          cross: true
        - target: armv7-unknown-linux-musleabi
          os: ubuntu-latest
          cross: true
        - target: riscv64gc-unknown-linux-gnu
          os: ubuntu-latest
          cross: true
        - target: x86_64-apple-darwin
          os: macos-latest
          cross: false
        - target: aarch64-apple-darwin
          os: macos-latest
          cross: false
        - target: x86_64-pc-windows-msvc
          os: windows-latest
          cross: false
        - target: aarch64-pc-windows-msvc
          os: windows-latest
          cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95
        with:
          target: ${{ matrix.target }}

      - name: Run cargo-cross
        if: ${{ matrix.cross }}
        run: |
          cargo install cross --git https://github.com/cross-rs/cross.git --locked --rev 085092ca01d6ac9f5a0b612d9e68bcdf1e50f7ee
          cross build -p tytanic --release --target ${{ matrix.target }} --features vendor-openssl

      - name: Run cargo
        if: ${{ !matrix.cross }}
        run: cargo build -p tytanic --release --target ${{ matrix.target }}

      - name: Create artifact directory
        shell: bash
        run: |
          directory=tytanic-${{ matrix.target }}
          mkdir $directory
          cp README.md docs/CHANGELOG.md LICENSE.MIT LICENSE.Apache-2.0 $directory
          if [ -f target/${{ matrix.target }}/release/tt.exe ]; then
            cp target/${{ matrix.target }}/release/tt.exe $directory
            7z a -r $directory.zip $directory
          else
            cp target/${{ matrix.target }}/release/tt $directory
            tar cJf $directory.tar.xz $directory
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: tytanic-${{ matrix.target }}
          path: "tytanic-${{ matrix.target }}.*"
          retention-days: 3

      - name: Add artifacts to release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        if: github.event_name == 'release'
        with:
          artifacts: "tytanic-${{ matrix.target }}.*"
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
