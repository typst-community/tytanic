# Stolen from https://github.com/helix-editor/helix/blob/079a789e8cb08ead67f19e1971a1b7438b37354b/.github/workflows/cachix.yml

# Publish the Nix flake outputs to Cachix
name: Cachix
on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Flake
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

    - name: Authenticate with Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: tytanic
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

    - name: Build flake
      run: nix build --print-build-logs
